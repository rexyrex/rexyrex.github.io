    <script>
    // Balloon rain: persistent <img> elements moved with transforms in a
    // single requestAnimationFrame loop (velocities are scaled by frame delta
    // to match the original 30ms tick speed). Respects reduced motion.
    document.addEventListener('DOMContentLoaded', function() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const image_width = 256;
        const image_height = 256;
        const total_size = 50;
        const balloon_image_count = 3;
        const speed_factor = 1;
        const BASE_TICK_MS = 30;

        let max_y = window.innerHeight + image_height;
        let max_x = window.innerWidth - image_width;

        window.addEventListener('resize', function() {
            max_y = window.innerHeight + image_height;
            max_x = window.innerWidth - image_width;
        });

        const balloonArea = document.getElementById('balloon-area');
        if (!balloonArea) return;

        function randomType(threshold) {
            if (Math.random() > threshold) return 'rexGreen';
            if (Math.random() > threshold) return 'rexRed';
            return 'balloon';
        }

        function srcFor(type, c) {
            if (type === 'rexGreen') return 'res/img/rexGreenSmall.png';
            if (type === 'rexRed') return 'res/img/rexRedSmall.png';
            return 'res/img/balloon' + c + '.png';
        }

        function spawnState(balloon, init) {
            balloon.type = randomType(init ? 0.9 : 0.87);
            balloon.c = Math.floor(Math.random() * balloon_image_count);
            if (init) {
                balloon.y = Math.floor(Math.random() * max_y);
                balloon.x = Math.floor(Math.random() * max_x);
                balloon.r = 30 * Math.random();
                balloon.xa = Math.random() * 5 + 2;
                balloon.ya = Math.random() * 10 - 5;
            } else {
                balloon.y = -image_height - Math.floor(100 * Math.random());
                balloon.x = Math.floor(Math.random() * max_x);
                balloon.r = 0;
                balloon.xa = Math.random() * 4 - 2;
                balloon.ya = Math.random() * 4 - 2;
            }
            balloon.el.src = srcFor(balloon.type, balloon.c);
        }

        const balloons = [];
        for (let i = 0; i < total_size; i++) {
            const el = document.createElement('img');
            el.alt = '';
            const balloon = { el: el };
            spawnState(balloon, true);
            balloonArea.appendChild(el);
            balloons.push(balloon);
        }

        let lastTime = null;
        let rafId = null;

        function step(now) {
            if (lastTime === null) lastTime = now;
            // Clamp the delta so a background tab or long frame can't teleport balloons
            const f = Math.min((now - lastTime) / BASE_TICK_MS, 3);
            lastTime = now;

            for (let i = 0; i < balloons.length; i++) {
                const b = balloons[i];
                b.ya += (3 * Math.random() * speed_factor - 1 * speed_factor) * f;
                b.xa += (2 * Math.random() * speed_factor - 1 * speed_factor) * f;

                b.y += b.ya * f;
                b.x += b.xa * f;
                b.r += (3 * Math.random() - 1) * f;

                if (b.y >= max_y - image_height) {
                    // Off the top: recycle in place as a fresh balloon below the viewport
                    spawnState(b, false);
                }

                // bottom-anchored: positive y moves the balloon up the screen
                b.el.style.transform = 'translate3d(' + b.x + 'px, ' + (-b.y) + 'px, 0) rotate(' + b.r + 'deg)';
            }

            rafId = requestAnimationFrame(step);
        }

        function start() {
            if (rafId === null) {
                lastTime = null;
                rafId = requestAnimationFrame(step);
            }
        }

        function stop() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) { stop(); } else { start(); }
        });

        start();
    });
    </script>
