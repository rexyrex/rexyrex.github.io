<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>우리 방 퀴즈 — 카톡 정밀 분석기</title>
    <!-- Quiz pages carry real chat snippets: never index them. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="친구가 우리 방 카톡 대화로 만든 퀴즈. 몇 점 나오는지 도전해보세요!">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="64x64" href="/apps/kakaoparser/img/icon-64.png">
    <link rel="apple-touch-icon" href="/apps/kakaoparser/img/icon-180.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="🧩 우리 방 퀴즈에 도전!">
    <meta property="og:description" content="우리 방 대화로 만든 퀴즈예요. 누가 한 말인지 맞혀보세요. 앱 없이 바로 풀 수 있어요.">
    <meta property="og:image" content="https://rexyrex.github.io/assets/og/apps/kakaoparser.jpg">
    <meta property="og:locale" content="ko_KR">
    <script>(function(){try{var t=localStorage.getItem('rex-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="preload" href="fonts/nsr-r.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/nsr-b.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="quiz.css?v=12">
</head>
<body>
<header class="appbar">
    <a class="brand" href="/apps/kakaoparser/" aria-label="카톡 정밀 분석기 소개">
        <img src="/apps/kakaoparser/img/icon-64.png" alt="" width="32" height="32">
        <span class="brand-name">카톡 정밀 분석기</span>
    </a>
    <span class="appbar-title" id="barTitle">우리 방 퀴즈</span>
    <a class="get-app" id="getAppBtn" href="https://play.google.com/store/apps/details?id=com.rexyrex.kakaoparser" target="_blank" rel="noopener">
        <span class="get-app-icon" aria-hidden="true"></span>앱 받기
    </a>
</header>

<main class="layout" id="layout">
    <!-- Desktop side column: quiz info + install. Hidden on phones. -->
    <aside class="side" id="side" hidden>
        <section class="card info-card">
            <div class="info-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg></div>
            <h2 class="info-title" id="sideTitle"></h2>
            <ul class="meta-list" id="sideMeta"></ul>
            <div class="side-progress" id="sideProgress" hidden>
                <div class="side-progress-label"><span>진행</span><b id="sideProgressText"></b></div>
                <div class="dots" id="sideDots"></div>
            </div>
        </section>
        <section class="card install-card" data-install></section>
    </aside>

    <section class="stage">
        <!-- Loading -->
        <div id="vLoading" class="view">
            <div class="card skeleton-card">
                <div class="sk sk-circle"></div>
                <div class="sk sk-line w60"></div>
                <div class="sk sk-line w40"></div>
                <div class="sk sk-block"></div>
                <div class="sk sk-btn"></div>
            </div>
        </div>

        <!-- Error / expired -->
        <div id="vError" class="view" hidden>
            <div class="card empty-card">
                <div class="empty-emoji" aria-hidden="true">🫥</div>
                <h1 class="empty-title" id="errTitle">퀴즈를 찾을 수 없어요</h1>
                <p class="muted" id="errText"></p>
                <button class="btn btn-secondary" id="retryLoadBtn" hidden>다시 불러오기</button>
            </div>
            <section class="card install-card only-mobile" data-install></section>
        </div>

        <!-- Intro -->
        <div id="vIntro" class="view" hidden>
            <section class="card hero-card">
                <div class="hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg></div>
                <h1 class="hero-title" id="introTitle"></h1>
                <p class="hero-sub">우리 방 대화로 만든 퀴즈예요.<br>누가 한 말인지, 다음에 뭐라고 했는지 맞혀보세요!</p>
                <ul class="chips" id="introChips"></ul>
                <ul class="type-list" id="introTypes"></ul>
                <label class="field-label" for="nameInput">내 이름 <span class="muted">(순위표에 보여요)</span></label>
                <input class="field" type="text" id="nameInput" maxlength="12" placeholder="이름 또는 별명" autocomplete="nickname" enterkeyhint="go">
                <button class="btn btn-primary btn-lg" id="startBtn">
                    <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg>퀴즈 시작
                </button>
                <button class="btn btn-secondary" id="viewResultBtn" hidden>내 결과와 순위 보기</button>
                <p class="fine" id="introNotice"></p>
            </section>
        </div>

        <!-- Question -->
        <div id="vQuestion" class="view" hidden>
            <div class="statsbar">
                <span class="stat">⭐ 맞힌 문제 <b id="qScore">0</b></span>
                <i class="stat-sep" aria-hidden="true"></i>
                <span class="stat">📝 <b id="qProgress">1 / 10</b></span>
            </div>
            <div class="dots dots-wide only-mobile" id="qDots" aria-hidden="true"></div>
            <article class="card q-card" aria-live="polite">
                <div class="q-type" id="qType"></div>
                <h2 class="q-title" id="qPrompt"></h2>
                <div class="q-body" id="qBody"></div>
            </article>
            <div class="choices" id="qChoices" role="group" aria-label="보기"></div>
            <p class="key-hint only-desktop">키보드: <kbd>1</kbd>–<kbd>5</kbd> 선택 · <kbd>Enter</kbd> 다음</p>
            <div class="nextbar" id="nextBar" hidden>
                <button class="btn btn-primary btn-lg" id="nextBtn">다음 문제 <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></button>
            </div>
        </div>

        <!-- Result -->
        <div id="vResult" class="view" hidden>
            <section class="card score-card">
                <div class="score-head" id="rTitle"></div>
                <div class="score-body">
                    <div class="ring" aria-hidden="true">
                        <svg viewBox="0 0 120 120">
                            <circle class="ring-track" cx="60" cy="60" r="52"/>
                            <circle class="ring-fill" id="rRing" cx="60" cy="60" r="52"/>
                        </svg>
                        <div class="ring-text"><b id="rScore">0</b><span id="rTotal">/ 10</span></div>
                    </div>
                    <p class="tier" id="rTier"></p>
                    <p class="rank-line" id="rRank"></p>
                    <p class="fine submit-line" id="rSubmit"></p>
                </div>
                <div class="score-actions">
                    <button class="btn btn-kakao btn-lg" id="shareBtn">
                        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-talk"/></svg><span id="shareLabel">친구에게 이 퀴즈 보내기</span>
                    </button>
                    <div class="btn-row">
                        <button class="btn btn-secondary" id="otherShareBtn" hidden>
                            <svg class="btn-icon sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-link"/></svg><span id="otherShareLabel">링크 복사</span>
                        </button>
                        <button class="btn btn-secondary" id="retryBtn">
                            <svg class="btn-icon sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-replay"/></svg>다시 풀기
                        </button>
                    </div>
                </div>
            </section>

            <div class="result-grid">
                <section class="card board-card">
                    <h2 class="card-title"><svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trophy"/></svg>순위</h2>
                    <ol class="board" id="board"></ol>
                    <p class="fine" id="boardNote"></p>
                </section>
                <section class="card stats-card" id="statsCard">
                    <h2 class="card-title"><svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chart"/></svg>문제별 정답률</h2>
                    <p class="hardest" id="hardest" hidden></p>
                    <p class="stats-note" id="statsNote" hidden></p>
                    <ol class="qstats" id="qStats"></ol>
                </section>
            </div>
            <section class="card install-card only-mobile" data-install></section>
        </div>
    </section>
</main>

<footer class="foot">
    퀴즈는 만든 날로부터 7일 뒤 자동으로 사라져요 · <a href="/apps/kakaoparser/">카톡 정밀 분석기</a>
</footer>

<div class="toast" id="toast" role="status" aria-live="assertive" hidden>
    <div class="toast-icon" id="toastIcon"></div>
    <div><b id="toastTitle"></b><span id="toastSub"></span></div>
</div>

<template id="tplInstall">
    <div class="install-head">
        <img src="/apps/kakaoparser/img/icon-180.png" alt="" width="52" height="52">
        <div>
            <b>카톡 정밀 분석기</b>
            <span class="muted">우리 방도 분석하고, 퀴즈도 만들어보세요</span>
        </div>
    </div>
    <ul class="install-points">
        <li>💬 누가 제일 많이 말하고 빨리 답하는지</li>
        <li>📊 시간대·월별 대화 패턴과 단어 순위</li>
        <li>🧩 우리 방 대화로 친구에게 퀴즈 내기</li>
    </ul>
    <div class="stores">
        <a class="store store-android" href="https://play.google.com/store/apps/details?id=com.rexyrex.kakaoparser" target="_blank" rel="noopener">
            <svg class="store-logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gplay"/></svg>
            <span class="store-text"><small><svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-android"/></svg>Android</small>Google Play</span>
        </a>
        <a class="store store-ios" href="https://apps.apple.com/app/id6758269062" target="_blank" rel="noopener">
            <svg class="store-logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-apple"/></svg>
            <span class="store-text"><small>iPhone · iPad</small>App Store</span>
        </a>
    </div>
</template>

<script src="quiz.js?v=8"></script>
</body>
</html>
