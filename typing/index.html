<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Typing Speed Test — Rexyrex</title>
    <meta name="description" content="A typing game in Korean, English and code: precise speed tests, a meteor shower to stop, dinosaurs to race, key drills and a daily challenge, with daily and all-time leaderboards. By rexyrex.">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/favicon.ico">
    <link rel="canonical" href="https://rexyrex.github.io/typing/">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f7f4" media="(prefers-color-scheme: light)">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="rexyrex.github.io">
    <meta property="og:url" content="https://rexyrex.github.io/typing/">
    <meta property="og:title" content="Typing Speed Test — Rexyrex">
    <meta property="og:description" content="Korean, English and code speed tests, a meteor shower to stop, dinosaurs to race and a daily challenge, with leaderboards.">
    <meta property="og:image" content="https://rexyrex.github.io/assets/og/typing.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Typing Speed Test — Rexyrex">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Typing Speed Test — Rexyrex">
    <meta name="twitter:description" content="Korean, English and code speed tests, a meteor shower to stop, dinosaurs to race and a daily challenge, with leaderboards.">
    <meta name="twitter:image" content="https://rexyrex.github.io/assets/og/typing.png">
    <script>(function(){try{var t=localStorage.getItem('rex-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var s=JSON.parse(localStorage.getItem('rex-type')||'{}');var l=(s.settings&&s.settings.ui)||((navigator.language||'').slice(0,2)==='ko'?'ko':'en');document.documentElement.lang=l;document.documentElement.setAttribute('data-ui',l);}catch(e){}setTimeout(function(){document.documentElement.classList.add('tg-ready');},4000);})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="css/typespeed2.css">
    <link rel="modulepreload" href="js/app.js">
    <script src="/js/common.js"></script>
  </head>

  <body class="tg-body">
    <div id="nav-placeholder"></div>

    <main id="main" class="tg" tabindex="-1">

      <!-- Game bar: brand, modes, sound / language / settings -->
      <header class="tg-bar">
        <a class="tg-brand" href="#/" aria-label="rex/type home">
          <span class="tg-brand-mark" aria-hidden="true"><i class="fa-solid fa-keyboard"></i></span>
          <span class="tg-brand-name">rex<b>/</b>type</span>
        </a>
        <nav class="tg-tabs" aria-label="Modes">
          <a href="#/test" data-route="test"><i class="fa-solid fa-gauge-high" aria-hidden="true"></i><span data-i18n="nav.test"></span></a>
          <a href="#/meteor" data-route="meteor"><i class="fa-solid fa-meteor" aria-hidden="true"></i><span data-i18n="nav.meteor"></span></a>
          <a href="#/race" data-route="race"><i class="fa-solid fa-flag-checkered" aria-hidden="true"></i><span data-i18n="nav.race"></span></a>
          <a href="#/daily" data-route="daily"><i class="fa-solid fa-calendar-day" aria-hidden="true"></i><span data-i18n="nav.daily"></span></a>
          <a href="#/drills" data-route="drills"><i class="fa-solid fa-hand" aria-hidden="true"></i><span data-i18n="nav.drills"></span></a>
          <a href="#/ranks" data-route="ranks"><i class="fa-solid fa-trophy" aria-hidden="true"></i><span data-i18n="nav.ranks"></span></a>
          <a href="#/stats" data-route="stats"><i class="fa-solid fa-chart-line" aria-hidden="true"></i><span data-i18n="nav.stats"></span></a>
        </nav>
        <div class="tg-tools">
          <button type="button" class="tg-icon-btn" id="soundBtn" data-i18n-label="tools.sound"><i class="fa-solid fa-volume-high" aria-hidden="true"></i></button>
          <button type="button" class="tg-icon-btn tg-lang-btn" id="langBtn" data-i18n-label="tools.lang"><span>KO</span><span>EN</span></button>
          <button type="button" class="tg-icon-btn" id="settingsBtn" data-i18n-label="tools.settings"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
        </div>
      </header>

      <!-- ============ Home ============ -->
      <section class="view view-home" data-view="home" aria-labelledby="homeTitle">
        <div class="home-hero">
          <div class="home-copy">
            <span class="eyebrow">/typing/</span>
            <h1 id="homeTitle" data-i18n="home.title"></h1>
            <p class="home-lede" data-i18n="home.lede"></p>
            <div class="home-cta">
              <a class="tg-btn tg-btn-primary tg-btn-lg" href="#/test" id="homeStart">
                <i class="fa-solid fa-play" aria-hidden="true"></i><span data-i18n="home.start"></span><kbd>enter</kbd>
              </a>
              <a class="tg-btn tg-btn-ghost tg-btn-lg" href="#/daily">
                <i class="fa-solid fa-calendar-day" aria-hidden="true"></i><span data-i18n="home.daily"></span><b class="home-daily-no" id="homeDailyNo"></b>
              </a>
            </div>
            <ul class="home-me" id="homeMe" aria-label="Your records"></ul>
          </div>

          <!-- keyboard-hero.js types sample sentences on this keyboard -->
          <div class="hero-demo" id="heroDemo" aria-hidden="true">
            <div class="demo-chrome"><i></i><i></i><i></i><span>~/typing — demo</span></div>
            <div class="demo-line">
              <span class="demo-mode" id="demoMode">한타</span>
              <span class="demo-text"><span class="demo-typed" id="demoTyped"></span><span class="demo-caret"></span><span class="demo-rest" id="demoRest"></span></span>
              <span class="demo-stat"><b id="demoScore">0</b> 타</span>
            </div>
            <div class="kbd" id="demoKeyboard"></div>
          </div>
        </div>

        <h2 class="home-h2" data-i18n="home.modes"></h2>
        <div class="mode-cards">
          <a class="mode-card mc-test" href="#/test">
            <span class="mc-art" aria-hidden="true"><span class="mc-gauge"><i></i></span></span>
            <span class="mc-body">
              <span class="mc-kicker" data-i18n="mc.test.kicker"></span>
              <span class="mc-title" data-i18n="nav.test"></span>
              <span class="mc-desc" data-i18n="mc.test.desc"></span>
            </span>
            <span class="mc-go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
          </a>
          <a class="mode-card mc-meteor" href="#/meteor">
            <span class="mc-art" aria-hidden="true"><span class="mc-rock r1"></span><span class="mc-rock r2"></span><span class="mc-rock r3"></span></span>
            <span class="mc-body">
              <span class="mc-kicker" data-i18n="mc.meteor.kicker"></span>
              <span class="mc-title" data-i18n="nav.meteor"></span>
              <span class="mc-desc" data-i18n="mc.meteor.desc"></span>
            </span>
            <span class="mc-go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
          </a>
          <a class="mode-card mc-race" href="#/race">
            <span class="mc-art" aria-hidden="true"><span class="mc-lane"><i></i></span><span class="mc-lane"><i></i></span><span class="mc-lane"><i></i></span></span>
            <span class="mc-body">
              <span class="mc-kicker" data-i18n="mc.race.kicker"></span>
              <span class="mc-title" data-i18n="nav.race"></span>
              <span class="mc-desc" data-i18n="mc.race.desc"></span>
            </span>
            <span class="mc-go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
          </a>
          <a class="mode-card mc-daily" href="#/daily">
            <span class="mc-art" aria-hidden="true"><span class="mc-cal"><b id="mcDailyNo">#1</b></span></span>
            <span class="mc-body">
              <span class="mc-kicker" data-i18n="mc.daily.kicker"></span>
              <span class="mc-title" data-i18n="nav.daily"></span>
              <span class="mc-desc" data-i18n="mc.daily.desc"></span>
            </span>
            <span class="mc-go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
          </a>
          <a class="mode-card mc-drills" href="#/drills">
            <span class="mc-art" aria-hidden="true"><span class="mc-keys"><i>ㅁ</i><i>ㄴ</i><i>ㅇ</i><i class="on">ㄹ</i></span></span>
            <span class="mc-body">
              <span class="mc-kicker" data-i18n="mc.drills.kicker"></span>
              <span class="mc-title" data-i18n="nav.drills"></span>
              <span class="mc-desc" data-i18n="mc.drills.desc"></span>
            </span>
            <span class="mc-go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
          </a>
        </div>

        <div class="home-split">
          <section class="tg-card home-board" aria-labelledby="homeBoardTitle">
            <header class="tg-card-head">
              <h2 id="homeBoardTitle" data-i18n="home.today"></h2>
              <div class="seg seg-sm" id="homeBoardTabs" role="tablist">
                <button type="button" role="tab" data-cat="kor" aria-selected="true">한글</button>
                <button type="button" role="tab" data-cat="eng">English</button>
                <button type="button" role="tab" data-cat="prg" data-i18n="lang.code"></button>
              </div>
            </header>
            <ol class="mini-board" id="homeBoard"></ol>
            <a class="tg-link" href="#/ranks"><span data-i18n="home.allRanks"></span> <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
          </section>
          <section class="tg-card home-how" aria-labelledby="homeHowTitle">
            <header class="tg-card-head"><h2 id="homeHowTitle" data-i18n="home.how"></h2></header>
            <ul class="how-list">
              <li><b data-i18n="how.k1"></b><span data-i18n="how.v1"></span></li>
              <li><b data-i18n="how.k2"></b><span data-i18n="how.v2"></span></li>
              <li><b data-i18n="how.k3"></b><span data-i18n="how.v3"></span></li>
              <li><b data-i18n="how.k4"></b><span data-i18n="how.v4"></span></li>
            </ul>
          </section>
        </div>
      </section>

      <!-- ============ Test (also daily challenge and drills) ============ -->
      <section class="view view-test" data-view="test" hidden aria-label="Typing test">
        <div class="daily-banner" id="dailyBanner" hidden>
          <span class="daily-no" id="dailyNo"></span>
          <div>
            <b data-i18n="daily.title"></b>
            <span id="dailyNote" data-i18n="daily.note"></span>
          </div>
          <div class="seg seg-sm" id="dailyLang">
            <button type="button" data-lang="ko">한글</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>

        <div class="drill-pick" id="drillPick" hidden>
          <div class="seg" id="drillLang">
            <button type="button" data-lang="ko">한글</button>
            <button type="button" data-lang="en">English</button>
          </div>
          <div class="drill-list" id="drillList"></div>
        </div>

        <div class="cfg" id="cfgBar" role="toolbar" aria-label="Test settings">
          <div class="cfg-group" data-k="lang">
            <button type="button" data-v="ko">한글</button>
            <button type="button" data-v="en">English</button>
            <button type="button" data-v="code" data-i18n="lang.code"></button>
          </div>
          <span class="cfg-sep"></span>
          <div class="cfg-group" data-k="src" id="cfgSrc"></div>
          <label class="cfg-select" id="cfgCodeWrap" hidden>
            <i class="fa-solid fa-code" aria-hidden="true"></i>
            <select id="cfgCode" aria-label="Language"></select>
          </label>
          <span class="cfg-sep"></span>
          <div class="cfg-group" data-k="kind">
            <button type="button" data-v="time" data-i18n-label="cfg.time"><i class="fa-regular fa-clock" aria-hidden="true"></i></button>
            <button type="button" data-v="count" data-i18n-label="cfg.count"><i class="fa-solid fa-hashtag" aria-hidden="true"></i></button>
          </div>
          <div class="cfg-group" data-k="len" id="cfgLen"></div>
          <span class="cfg-sep" id="cfgOptSep"></span>
          <div class="cfg-group cfg-toggles" id="cfgOpts">
            <button type="button" data-t="punct" data-i18n-title="cfg.punctTip"><i class="fa-solid fa-at" aria-hidden="true"></i><span data-i18n="cfg.punct"></span></button>
            <button type="button" data-t="nums" data-i18n-title="cfg.numsTip"><i class="fa-solid fa-hashtag" aria-hidden="true"></i><span data-i18n="cfg.nums"></span></button>
          </div>
          <div class="cfg-group" data-k="diff" id="cfgDiff">
            <button type="button" data-v="easy" data-i18n="cfg.easy"></button>
            <button type="button" data-v="normal" data-i18n="cfg.normal"></button>
            <button type="button" data-v="hard" data-i18n="cfg.hard"></button>
          </div>
          <span class="cfg-sep"></span>
          <div class="cfg-group cfg-toggles">
            <button type="button" data-t="sudden" data-i18n-title="cfg.suddenTip"><i class="fa-solid fa-skull" aria-hidden="true"></i><span data-i18n="cfg.sudden"></span></button>
            <button type="button" data-t="pace" data-i18n-title="cfg.paceTip"><i class="fa-solid fa-ghost" aria-hidden="true"></i><span data-i18n="cfg.pace"></span></button>
          </div>
        </div>

        <div class="stage-wrap">
          <div class="stage" id="testStage"></div>
        </div>

        <div class="tg-kbd-slot" id="testKbd"></div>

        <p class="tg-keys-hint">
          <span><kbd>tab</kbd> <span data-i18n="hint.restart"></span></span>
          <span><kbd>enter</kbd> / <kbd>space</kbd> <span data-i18n="hint.next"></span></span>
          <span><kbd>esc</kbd> <span data-i18n="hint.menu"></span></span>
        </p>
      </section>

      <!-- ============ Result ============ -->
      <section class="view view-result" data-view="result" hidden aria-labelledby="resTitle">
        <h2 class="sr-only" id="resTitle" data-i18n="res.title"></h2>
        <div class="res" id="result"></div>
      </section>

      <!-- ============ Meteor ============ -->
      <section class="view view-meteor" data-view="meteor" hidden aria-label="Meteor defense">
        <div class="mt" id="meteor">
          <div class="mt-hud">
            <div class="mt-stat"><span data-i18n="mt.score"></span><b id="mtScore">0</b></div>
            <div class="mt-stat"><span data-i18n="mt.level"></span><b id="mtLevel">1</b></div>
            <div class="mt-stat mt-combo"><span data-i18n="mt.combo"></span><b id="mtCombo">x1</b></div>
            <div class="mt-lives" id="mtLives" aria-label="Lives"></div>
            <button type="button" class="tg-icon-btn" id="mtPause" data-i18n-label="mt.pause"><i class="fa-solid fa-pause" aria-hidden="true"></i></button>
          </div>
          <div class="mt-sky" id="mtSky">
            <div class="mt-stars"></div>
            <div class="mt-moon"></div>
            <div class="mt-field" id="mtField"></div>
            <div class="mt-ground">
              <div class="mt-volcano"></div>
              <div class="mt-hill"></div>
              <img class="mt-rex" id="mtRex" src="/assets/rexGreenSmall.png" alt="" width="256" height="256">
            </div>
            <div class="mt-banner" id="mtBanner" aria-live="polite"></div>
            <div class="mt-overlay" id="mtOverlay"></div>
          </div>
          <div class="mt-input">
            <span class="prompt-mark" aria-hidden="true">›</span>
            <input id="mtInput" data-i18n-label="mt.placeholder" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" data-i18n-placeholder="mt.placeholder">
            <span class="mt-input-hint"><kbd>enter</kbd></span>
          </div>
        </div>
      </section>

      <!-- ============ Race ============ -->
      <section class="view view-race" data-view="race" hidden aria-label="Dino race">
        <div class="rc" id="race">
          <div class="rc-track" id="rcTrack"></div>
          <div class="stage-wrap">
            <div class="stage stage-race" id="raceStage"></div>
          </div>
          <div class="rc-overlay" id="rcOverlay"></div>
        </div>
      </section>

      <!-- ============ Leaderboards ============ -->
      <section class="view view-ranks" data-view="ranks" hidden aria-labelledby="ranksTitle">
        <header class="view-head">
          <div>
            <span class="eyebrow">/typing/#ranks</span>
            <h1 id="ranksTitle" data-i18n="ranks.title"></h1>
          </div>
          <div class="seg" id="rankRange">
            <button type="button" data-range="daily" data-i18n="ranks.today"></button>
            <button type="button" data-range="all" data-i18n="ranks.all"></button>
          </div>
        </header>
        <div class="seg seg-wide" id="rankCats" role="tablist">
          <button type="button" role="tab" data-cat="kor"><i class="fa-solid fa-language" aria-hidden="true"></i> 한글</button>
          <button type="button" role="tab" data-cat="eng"><i class="fa-solid fa-earth-americas" aria-hidden="true"></i> English</button>
          <button type="button" role="tab" data-cat="prg"><i class="fa-solid fa-code" aria-hidden="true"></i> <span data-i18n="lang.code"></span></button>
          <button type="button" role="tab" data-cat="meteor"><i class="fa-solid fa-meteor" aria-hidden="true"></i> <span data-i18n="nav.meteor"></span></button>
        </div>
        <p class="ranks-note" id="ranksNote"></p>
        <div class="tg-card rank-card">
          <table class="rank-table" id="rankTable">
            <thead><tr><th data-i18n="ranks.place"></th><th data-i18n="ranks.name"></th><th data-i18n="ranks.grade"></th><th class="num" data-i18n="ranks.score"></th><th class="num rank-date" data-i18n="ranks.date"></th></tr></thead>
            <tbody></tbody>
          </table>
          <div class="rank-state" id="rankState"></div>
        </div>
      </section>

      <!-- ============ My stats ============ -->
      <section class="view view-stats" data-view="stats" hidden aria-labelledby="statsTitle">
        <header class="view-head">
          <div>
            <span class="eyebrow">/typing/#stats</span>
            <h1 id="statsTitle" data-i18n="stats.title"></h1>
          </div>
        </header>
        <div id="statsBody"></div>
      </section>
    </main>

    <!-- Settings -->
    <dialog class="tg-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog" class="tg-dialog-in">
        <header class="tg-dialog-head">
          <h2 id="settingsTitle" data-i18n="set.title"></h2>
          <button class="tg-icon-btn" value="close" data-i18n-label="ui.close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="set-rows" id="settingsRows"></div>
        <footer class="tg-dialog-foot">
          <button type="button" class="tg-btn tg-btn-danger-ghost" id="resetData"><i class="fa-solid fa-trash-can" aria-hidden="true"></i><span data-i18n="set.reset"></span></button>
          <button class="tg-btn tg-btn-primary" value="close" data-i18n="ui.done"></button>
        </footer>
      </form>
    </dialog>

    <!-- Save to leaderboard -->
    <dialog class="tg-dialog tg-dialog-sm" id="saveDialog" aria-labelledby="saveTitle">
      <form class="tg-dialog-in" id="saveForm">
        <header class="tg-dialog-head">
          <h2 id="saveTitle" data-i18n="save.title"></h2>
          <button type="button" class="tg-icon-btn" id="saveClose" data-i18n-label="ui.close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <p class="save-summary" id="saveSummary"></p>
        <label class="tg-field">
          <span data-i18n="save.name"></span>
          <input id="saveName" maxlength="8" autocomplete="nickname" data-i18n-placeholder="save.placeholder" required>
        </label>
        <p class="save-msg" id="saveMsg" role="status"></p>
        <footer class="tg-dialog-foot">
          <button type="submit" class="tg-btn tg-btn-primary" id="saveSubmit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span data-i18n="save.submit"></span></button>
        </footer>
      </form>
    </dialog>

    <!-- Version history (hold the brand mark for 3 seconds) -->
    <dialog class="tg-dialog" id="versionDialog" aria-labelledby="versionTitle">
      <form method="dialog" class="tg-dialog-in">
        <header class="tg-dialog-head">
          <h2 id="versionTitle">Version history</h2>
          <button class="tg-icon-btn" value="close" aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <table class="rank-table"><thead><tr><th>ver</th><th>changes</th></tr></thead><tbody id="versionRows"></tbody></table>
      </form>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <noscript><p class="tg-noscript">rex/type needs JavaScript to run.</p></noscript>

    <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-analytics.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-firestore.js" defer></script>
    <script src="data/simple_words.js" defer></script>
    <script src="js/keyboard-hero.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
