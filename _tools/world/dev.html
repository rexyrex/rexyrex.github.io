<!doctype html>
<meta charset="utf-8">
<title>island dev</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}#log{position:fixed;left:8px;bottom:8px;font:12px ui-monospace,monospace;color:#9f9;background:#0008;padding:4px 8px;white-space:pre}</style>
<canvas id="c"></canvas><div id="log">loading…</div>
<script type="module">
// Bare page for looking at the world without the site around it.
//   /_tools/world/dev.html?tier=ultra&view=x,y,z,tx,ty,tz&webgl=1&hud=0
const q = new URLSearchParams(location.search);
const log = document.getElementById('log');
if (q.get('hud') === '0') log.style.display = 'none';
window.__world = null; window.__error = null;
try {
    const { createWorld } = await import('/js/' + (q.get('bundle') || 'world') + '.js?' + Date.now());
    const world = await createWorld({ canvas: document.getElementById('c'), tier: q.get('tier') || 'ultra', forceWebGL: q.get('webgl') === '1', flags: { bare: q.get('bare') === '1', nopost: q.get('post') === '0', nophoto: q.get('photo') === '0', fixed: true, salt: +q.get('salt') || 0, trace: q.get('trace') === '1', tm: q.get('tm') || '', q: Object.fromEntries((q.get('q') || '').split(',').filter(Boolean).map((kv) => { const [k, v] = kv.split(':'); return [k, +v]; })), nocover: q.get('cover') === '0', exp: +q.get('exp') || 0, nbias: +q.get('nbias') || 0 }, apps: [['kakaoparser','#fb9a4b'],['age_calculator','#ff8a7a'],['deadly_balloons','#ff5d6c'],['alba_pay','#d8f35b'],['visual_metronome','#e4b96a'],['line_chat_analyzer','#a99dff'],['kakao_love_analyzer','#f48fb1'],['reverse_image_search','#818cf8'],['qr_scanner','#aba3ff'],['exif','#b6c3f7'],['saju','#8cc3d3'],['katalk_keeper','#fde524']].map(([id, tint]) => ({ id, tint, icon: '/apps/' + id + '/img/icon.webp' })), onProgress: (l, p) => { log.textContent = `${l} ${(p * 100) | 0}%`; } });
    if (q.get('view')) world.setView(...q.get('view').split(',').map(Number));
    world.start();
    window.__world = world;
    log.textContent = `${world.backend} · ${world.quality.name}`;
} catch (e) { window.__error = String(e && e.stack || e); log.textContent = window.__error; console.error(e); }
</script>
