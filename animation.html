<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Animation Lab — Rexyrex</title>
        <meta name="description" content="A scratchpad of CSS text effects by rexyrex, built on Vue 3. Pick an effect or let it shuffle.">
        <meta name="color-scheme" content="dark light">
        <link rel="icon" href="/favicon.ico">
        <script>(function(){try{var t=localStorage.getItem('rex-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/vue@3.5.41/dist/vue.global.prod.js" integrity="sha384-arPHRzOKPl8g3Rbe/cQBWYPnq4HcxfPFSFWD3qvI/hc2XQf+4GkVqkOlWgjN5mD3" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="/css/index.css">
        <link rel="stylesheet" href="/css/navbar.css">
        <style>
            /* Page chrome — tokens from /css/index.css. The effect styles
               below this block are the lab's content and are left as they are. */
            .animation-section {
                padding: clamp(2rem, 5vw, 3.5rem) 0 3rem;
                position: relative;
            }

            .animation-section .container {
                max-width: var(--measure);
            }

            .page-header {
                margin-bottom: 2rem;
            }

            .page-header::before {
                content: "/animation.html";
                display: block;
                font-family: var(--font-mono);
                font-size: 0.8rem;
                font-weight: 500;
                color: var(--accent);
                margin-bottom: 0.75rem;
            }

            .page-title {
                font-size: clamp(1.75rem, 1.2rem + 2.6vw, 2.75rem);
                margin-bottom: 0.5rem;
            }

            .page-subtitle {
                font-size: 1.1rem;
                color: var(--fg-muted);
                max-width: 60ch;
                margin: 0;
            }

            .animation-card {
                background: var(--bg-raised);
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                padding: clamp(1.25rem, 3vw, 2rem);
                margin-bottom: 1.5rem;
                position: relative;
                overflow: hidden;
                color: var(--fg);
            }

            .animation-card h3 {
                font-size: 1.05rem;
                margin-bottom: 1.25rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .animation-card h3 i {
                color: var(--accent);
            }

            .showcase-title {
                font-size: 1.1rem;
                margin: 0 0 1rem;
                text-align: left;
            }

            .showcase-title::before {
                content: "stage";
                font-size: 0.8rem;
                font-weight: 500;
                color: var(--accent);
                margin-right: 1rem;
            }

            .showcase-controls {
                display: flex;
                flex-wrap: wrap;
                gap: 0.6rem;
                margin-bottom: 1rem;
            }

            .control-btn {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                font-family: var(--font-mono);
                font-size: 0.875rem;
                font-weight: 500;
                line-height: 1;
                padding: 0.75rem 1.05rem;
                border-radius: var(--radius);
                border: 1px solid var(--line-strong);
                background: transparent;
                color: var(--fg);
                cursor: pointer;
                transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
            }

            .control-btn:hover {
                background: var(--bg-hover);
                border-color: var(--fg-muted);
            }

            .control-btn--primary {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--accent-ink);
            }

            .control-btn--primary:hover {
                background: var(--accent-strong);
                border-color: var(--accent-strong);
            }

            .control-btn--stop {
                border-color: var(--danger);
                color: var(--danger);
            }

            .control-btn--stop:hover {
                background: color-mix(in srgb, var(--danger) 12%, transparent);
                border-color: var(--danger);
            }

            .effect-select {
                font-family: var(--font-mono);
                font-size: 0.875rem;
                min-width: min(100%, 320px);
                padding: 0.7rem 0.9rem;
                background: var(--bg-inset);
                color: var(--fg);
                border: 1px solid var(--line-strong);
                border-radius: var(--radius);
            }

            .effect-select:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .demo-content {
                background: var(--bg-inset);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                padding: 1.5rem;
                margin: 1rem 0;
                min-height: 100px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .demo-text {
                color: var(--fg);
                text-align: center;
                line-height: 1.6;
            }

            /* The stage where effects play. Effects assume a big bold face. */
            .stage {
                min-height: 320px;
                position: relative;
                font-size: 2.5rem;
                font-weight: 700;
                overflow: hidden;
            }

            .stage-inner {
                width: 100%;
                min-height: 200px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .stage-empty {
                text-align: center;
                color: var(--fg-muted);
                font-family: var(--font-mono);
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.7;
            }

            .stage-empty i {
                display: block;
                font-size: 2rem;
                color: var(--accent);
                margin-bottom: 0.75rem;
            }

            .stage-empty small {
                color: var(--fg-faint);
                font-size: 0.85em;
            }

            .stage-status {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.75rem 1.25rem;
                font-family: var(--font-mono);
                font-size: 0.8rem;
                color: var(--fg-muted);
            }

            .stage-status .current {
                color: var(--fg);
            }

            .stage-status .current b {
                font-weight: 500;
                color: var(--accent);
            }

            .stage-meter {
                width: 160px;
                height: 4px;
                background: var(--bg-inset);
                border: 1px solid var(--line);
                border-radius: 999px;
                overflow: hidden;
            }

            .stage-meter > div {
                height: 100%;
                background: var(--accent);
                transition: width 0.1s linear;
            }

            .stage-next {
                color: var(--fg-faint);
            }

            .master-btn {
                background: var(--accent);
                border: 1px solid var(--accent);
                border-radius: var(--radius);
                padding: 1rem 2rem;
                color: var(--accent-ink);
                font-family: var(--font-mono);
                font-weight: 600;
                font-size: 1.1rem;
                width: 100%;
                margin-bottom: 2rem;
                cursor: pointer;
            }

            .number-controls {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }

            .number-line {
                background: var(--bg-inset);
                border-radius: var(--radius);
                padding: 2rem;
                border: 1px solid var(--line);
                min-height: 200px;
            }

            .list-item {
                display: inline-block;
                margin: 0.25rem;
                padding: 0.4rem 0.8rem;
                background: var(--accent-soft);
                color: var(--accent);
                border: 1px solid var(--line);
                border-radius: 999px;
                font-family: var(--font-mono);
                font-size: 0.85rem;
            }

            .progress {
                background: var(--bg-inset);
                border-radius: 999px;
                height: 8px;
                margin: 1rem 0;
                overflow: hidden;
            }

            .progress-bar {
                background: var(--accent);
                transition: width 0.3s ease;
            }

            /* Advanced Fancy Animation Styles */
            
            /* Matrix Rain Effect */
            .matrix-text {
                font-family: 'Courier New', monospace;
                color: #00ff00;
                letter-spacing: 2px;
                font-weight: bold;
                text-shadow: 0 0 10px #00ff00;
            }
            
            .matrix-text .matrix-char {
                display: inline-block;
                animation: matrixDrop 0.1s ease-in-out infinite;
            }
            
            @keyframes matrixDrop {
                0%, 100% {
                    opacity: 1;
                    transform: translateY(0px);
                    color: #00ff00;
                    text-shadow: 0 0 10px #00ff00;
                }
                50% {
                    opacity: 0.7;
                    transform: translateY(2px);
                    color: #00ff88;
                    text-shadow: 0 0 15px #00ff88;
                }
            }
            
            /* Particle Explosion */
            .explosion-container {
                position: relative;
                display: inline-block;
            }
            
            .explosion-particle {
                position: absolute;
                width: 12px;
                height: 12px;
                background: radial-gradient(circle, #ff6b35 0%, #f093fb 30%, #4facfe 60%, #00f2fe 100%);
                border-radius: 50%;
                pointer-events: none;
                box-shadow: 0 0 30px currentColor, 0 0 60px currentColor, 0 0 90px rgba(255, 107, 53, 0.5);
                filter: brightness(2) saturate(2);
            }
            
            .explosion-enter-active {
                animation: fadeInScale 0.5s ease-out;
            }
            
            .explosion-leave-active {
                animation: fadeOutScale 0.5s ease-in;
            }
            
            @keyframes fadeInScale {
                0% {
                    opacity: 0;
                    transform: scale(0.5);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            
            @keyframes fadeOutScale {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                100% {
                    opacity: 0;
                    transform: scale(0.5);
                }
            }
            
            @keyframes explodeParticle {
                0% {
                    opacity: 1;
                    transform: translate(0, 0) scale(1) rotate(0deg);
                    filter: brightness(3) saturate(3) hue-rotate(0deg);
                    box-shadow: 0 0 30px currentColor, 0 0 60px currentColor, 0 0 90px rgba(255, 107, 53, 0.8);
                }
                25% {
                    opacity: 1;
                    transform: translate(calc(var(--dx) * 0.3), calc(var(--dy) * 0.3)) scale(1.5) rotate(90deg);
                    filter: brightness(4) saturate(4) hue-rotate(90deg);
                    box-shadow: 0 0 50px currentColor, 0 0 100px currentColor, 0 0 150px rgba(255, 107, 53, 0.6);
                }
                50% {
                    opacity: 0.8;
                    transform: translate(calc(var(--dx) * 0.6), calc(var(--dy) * 0.6)) scale(2) rotate(180deg);
                    filter: brightness(5) saturate(5) hue-rotate(180deg);
                    box-shadow: 0 0 70px currentColor, 0 0 140px currentColor, 0 0 210px rgba(255, 107, 53, 0.4);
                }
                75% {
                    opacity: 0.4;
                    transform: translate(calc(var(--dx) * 0.8), calc(var(--dy) * 0.8)) scale(1.2) rotate(270deg);
                    filter: brightness(3) saturate(3) hue-rotate(270deg);
                    box-shadow: 0 0 40px currentColor, 0 0 80px currentColor, 0 0 120px rgba(255, 107, 53, 0.3);
                }
                100% {
                    opacity: 0;
                    transform: translate(var(--dx), var(--dy)) scale(0) rotate(360deg);
                    filter: brightness(1) saturate(1) hue-rotate(360deg);
                    box-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px rgba(255, 107, 53, 0.1);
                }
            }
            
            /* Morphing Shape */
            .morph-enter-active, .morph-leave-active {
                transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                animation: morphLoop 4s ease-in-out infinite;
            }
            .morph-enter, .morph-leave-to {
                opacity: 0;
                transform: scale(0.3) skew(45deg) rotateX(90deg);
                border-radius: 50%;
                filter: blur(10px) hue-rotate(180deg);
            }
            @keyframes morphLoop {
                0%, 100% { transform: scale(1) skew(0deg) rotateX(0deg); filter: hue-rotate(0deg); }
                25% { transform: scale(1.2) skew(10deg) rotateX(90deg); filter: hue-rotate(90deg); }
                50% { transform: scale(0.8) skew(-15deg) rotateX(180deg); filter: hue-rotate(180deg); }
                75% { transform: scale(1.1) skew(5deg) rotateX(270deg); filter: hue-rotate(270deg); }
            }
            
            /* Typewriter Effect */
            .typewriter-text {
                overflow: hidden;
                border-right: 3px solid #64ffda;
                white-space: nowrap;
                animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
                font-family: 'JetBrains Mono', monospace;
                letter-spacing: .1em;
            }
            
            .typewriter-enter-active {
                animation: typewriterFull 4s steps(40, end) infinite;
                overflow: hidden;
                border-right: 3px solid #00d2d3;
                white-space: nowrap;
                font-family: 'JetBrains Mono', monospace;
                color: #00d2d3 !important;
            }
            
            @keyframes typing {
                from { width: 0; }
                to { width: 100%; }
            }
            
            @keyframes typewriterFull {
                0%, 10% { width: 0; border-color: #00d2d3; }
                50%, 90% { width: 100%; border-color: #00d2d3; }
                91%, 100% { width: 100%; border-color: transparent; }
            }
            
            @keyframes blink-caret {
                from, to { border-color: transparent; }
                50% { border-color: #64ffda; }
            }
            
            /* 3D Rotation */
            .rotate3d-enter-active, .rotate3d-leave-active {
                transition: all 1.5s ease;
            }
            .rotate3d-enter, .rotate3d-leave-to {
                opacity: 0;
                transform: perspective(800px) rotateX(-90deg) rotateY(180deg) rotateZ(45deg) scale(0.5);
            }
            
            .rotation-enter-active {
                animation: rotation3D 3s ease-in-out infinite;
                transform-style: preserve-3d;
            }
            
            @keyframes rotation3D {
                0% {
                    transform: perspective(1000px) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
                }
                25% {
                    transform: perspective(1000px) rotateX(90deg) rotateY(90deg) rotateZ(45deg);
                }
                50% {
                    transform: perspective(1000px) rotateX(180deg) rotateY(180deg) rotateZ(90deg);
                }
                75% {
                    transform: perspective(1000px) rotateX(270deg) rotateY(270deg) rotateZ(135deg);
                }
                100% {
                    transform: perspective(1000px) rotateX(360deg) rotateY(360deg) rotateZ(180deg);
                }
            }
            
            /* Wave Effect */
            .wave-text {
                display: inline-block;
            }
            
            .wave-text .wave-char {
                display: inline-block;
                animation: waveChar 2s ease-in-out infinite;
            }
            
            @keyframes waveChar {
                0%, 100% {
                    transform: translateY(0px) rotateZ(0deg);
                }
                25% {
                    transform: translateY(-15px) rotateZ(5deg);
                }
                50% {
                    transform: translateY(0px) rotateZ(0deg);
                }
                75% {
                    transform: translateY(15px) rotateZ(-5deg);
                }
            }
            
            /* Glitch Effect */
            .glitch-enter-active {
                animation: glitch 1s ease-in-out infinite;
            }
            .glitch-leave-active {
                animation: glitch 1s ease-in-out infinite reverse;
            }
            @keyframes glitch {
                0%, 100% {
                    opacity: 1;
                    transform: translate(0);
                    filter: hue-rotate(0deg);
                }
                10% {
                    opacity: 0.8;
                    transform: translate(-2px, 2px);
                    filter: hue-rotate(90deg);
                }
                20% {
                    opacity: 0.9;
                    transform: translate(2px, -2px);
                    filter: hue-rotate(180deg);
                }
                30% {
                    opacity: 0.7;
                    transform: translate(-3px, 1px);
                    filter: hue-rotate(270deg);
                }
                40% {
                    opacity: 1;
                    transform: translate(1px, -3px);
                    filter: hue-rotate(360deg);
                }
                50% {
                    opacity: 0.9;
                    transform: translate(-1px, 3px);
                    filter: hue-rotate(45deg);
                }
            }
            
            /* Holographic */
            .hologram-enter-active, .hologram-leave-active {
                transition: all 1.5s ease;
                animation: hologramLoop 3s ease-in-out infinite;
            }
            .hologram-enter, .hologram-leave-to {
                opacity: 0;
                transform: translateZ(-100px) scale(0.8);
                filter: blur(5px) brightness(2) contrast(1.5);
                background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            }
            @keyframes hologramLoop {
                0%, 100% { filter: blur(0px) brightness(1) contrast(1); opacity: 1; }
                50% { filter: blur(3px) brightness(1.5) contrast(2); opacity: 0.7; }
            }
            
            /* Elastic */
            .elastic-enter-active {
                animation: elastic 2s cubic-bezier(0.68, -0.55, 0.265, 1.55), elasticLoop 3s ease-in-out infinite;
            }
            .elastic-leave-active {
                animation: elastic 1s ease-in reverse;
            }
            @keyframes elasticLoop {
                0%, 100% { transform: scale(1, 1); }
                25% { transform: scale(1.1, 0.9); }
                50% { transform: scale(0.9, 1.1); }
                75% { transform: scale(1.05, 0.95); }
            }
            @keyframes elastic {
                0% {
                    opacity: 0;
                    transform: scale(0, 0);
                }
                50% {
                    opacity: 0.8;
                    transform: scale(1.2, 0.8);
                }
                75% {
                    opacity: 1;
                    transform: scale(0.9, 1.1);
                }
                100% {
                    opacity: 1;
                    transform: scale(1, 1);
                }
            }
            
            /* Magnetic Field */
            .magnetic-enter-active, .magnetic-leave-active {
                transition: all 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                animation: magneticLoop 4s ease-in-out infinite;
            }
            .magnetic-enter, .magnetic-leave-to {
                opacity: 0;
                transform: translate(var(--random-x, 50px), var(--random-y, -30px)) rotate(var(--random-r, 180deg)) scale(0.3);
                filter: blur(8px);
            }
            @keyframes magneticLoop {
                0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
                25% { transform: translate(10px, -5px) rotate(90deg) scale(1.1); }
                50% { transform: translate(-8px, 8px) rotate(180deg) scale(0.9); }
                75% { transform: translate(5px, -10px) rotate(270deg) scale(1.05); }
            }
            
            /* Fire Effect */
            .fire-text {
                color: #ff4757 !important;
                font-weight: bold;
                animation: fireFlicker 0.5s ease-in-out infinite alternate;
                text-shadow: 
                    0 0 5px #ff6b35,
                    0 0 10px #ff6b35,
                    0 0 15px #ff6b35,
                    0 0 20px #ff4757,
                    0 0 35px #ff4757,
                    0 0 40px #ff4757,
                    0 0 50px #ff3742,
                    0 0 60px #ff3742;
                position: relative;
            }
            
            .fire-text::before {
                content: attr(data-text);
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                color: #ffaa00;
                z-index: -1;
                animation: fireFlicker2 0.3s ease-in-out infinite alternate;
                text-shadow: 
                    0 0 3px #ffaa00,
                    0 0 8px #ffaa00,
                    0 0 12px #ff6b35;
            }
            
            @keyframes fireFlicker {
                0% {
                    text-shadow: 
                        0 0 5px #ff6b35,
                        0 0 10px #ff6b35,
                        0 0 15px #ff6b35,
                        0 0 20px #ff4757,
                        0 0 35px #ff4757,
                        0 0 40px #ff4757,
                        0 0 50px #ff3742,
                        0 0 60px #ff3742;
                    transform: translateY(0px) scale(1);
                }
                100% {
                    text-shadow: 
                        0 0 3px #ff6b35,
                        0 0 8px #ff6b35,
                        0 0 12px #ff6b35,
                        0 0 16px #ff4757,
                        0 0 25px #ff4757,
                        0 0 30px #ff4757,
                        0 0 40px #ff3742,
                        0 0 50px #ff3742;
                    transform: translateY(-1px) scale(1.02);
                }
            }
            
            @keyframes fireFlicker2 {
                0% {
                    transform: translateY(1px) translateX(-1px) scale(0.98);
                    opacity: 0.8;
                }
                100% {
                    transform: translateY(-1px) translateX(1px) scale(1.02);
                    opacity: 0.9;
                }
            }

            /* Random Effect Showcase Animations */
            @keyframes gradientShift {
                0%, 100% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
            }

            /* Smooth transition for random effects */
            .random-effect-container {
                transition: opacity 0.3s ease, transform 0.3s ease;
                will-change: opacity, transform;
            }

            /* Crazy Random Animations */
            .chaos-spin {
                animation: chaosSpin 2s linear infinite;
            }
            @keyframes chaosSpin {
                0% { transform: rotate(0deg) scale(1) skew(0deg); }
                25% { transform: rotate(90deg) scale(1.2) skew(10deg); }
                50% { transform: rotate(180deg) scale(0.8) skew(-10deg); }
                75% { transform: rotate(270deg) scale(1.5) skew(5deg); }
                100% { transform: rotate(360deg) scale(1) skew(0deg); }
            }

            .dimension-warp {
                animation: dimensionWarp 3s ease-in-out infinite;
                transform-style: preserve-3d;
                perspective: 1000px;
            }
            @keyframes dimensionWarp {
                0%, 100% { 
                    transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
                    filter: hue-rotate(0deg) brightness(1);
                }
                33% { 
                    transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg) scale(1.3);
                    filter: hue-rotate(120deg) brightness(1.5);
                }
                66% { 
                    transform: rotateX(90deg) rotateY(180deg) rotateZ(-45deg) scale(0.7);
                    filter: hue-rotate(240deg) brightness(0.8);
                }
            }

            .reality-glitch {
                animation: realityGlitch 1.5s ease-in-out infinite;
            }
            @keyframes realityGlitch {
                0%, 90%, 100% { 
                    transform: translate(0, 0) scale(1);
                    filter: hue-rotate(0deg) blur(0px);
                    opacity: 1;
                }
                10% { 
                    transform: translate(-10px, 5px) scale(1.1);
                    filter: hue-rotate(90deg) blur(2px);
                    opacity: 0.8;
                }
                20% { 
                    transform: translate(8px, -3px) scale(0.9);
                    filter: hue-rotate(180deg) blur(1px);
                    opacity: 1.2;

                 transform-origin: 0 0;
                 animation: orbitLightning1 1.5s linear infinite;
                 white-space: nowrap;
                 letter-spacing: 22px;
             }

                 content: '🔆 ⚡ 💥 ✨ 🌟';
                 position: absolute;
                 font-size: 1.6rem;
                 left: 50%;
                 top: 50%;
                 transform-origin: 0 0;

                 animation-delay: -0.75s;
                 white-space: nowrap;
                 letter-spacing: 18px;

                 25% { opacity: 1; }
                 40% { opacity: 0.6; }
                 50% { transform: translate(-50%, -50%) rotate(180deg) translateX(85px) rotate(-180deg); opacity: 1; }
                 70% { opacity: 0.4; }
                 75% { opacity: 1; }
                 90% { opacity: 0.5; }
                 100% { transform: translate(-50%, -50%) rotate(360deg) translateX(85px) rotate(-360deg); opacity: 1; }

                 0% { transform: translate(-50%, -50%) rotate(0deg) translateX(65px) rotate(0deg); opacity: 0.8; }
                 30% { opacity: 0.2; }
                 50% { transform: translate(-50%, -50%) rotate(180deg) translateX(65px) rotate(-180deg); opacity: 1; }
                 80% { opacity: 0.3; }
                 100% { transform: translate(-50%, -50%) rotate(360deg) translateX(65px) rotate(-360deg); opacity: 0.8; }
             }
             @keyframes lightningRing {
                 0%, 100% { filter: brightness(1) contrast(1) hue-rotate(0deg); }
                 25% { filter: brightness(2.5) contrast(2) hue-rotate(60deg); }
                 50% { filter: brightness(3) contrast(2.5) hue-rotate(120deg); }
                 75% { filter: brightness(2) contrast(1.8) hue-rotate(180deg); }
             }

             /* Fire Circle */

                 animation: fireCircle 2.5s ease-in-out infinite;
                 position: relative;
                 text-shadow: 0 0 25px #ff5722, 0 0 35px #ff9800, 0 0 45px #ffeb3b;
             }
             .fire-circle::before {
                 content: '🔥 🌋 💥 🔆 ✨';
                 position: absolute;
                 font-size: 1.6rem;
                 left: 50%;
                 top: 50%;
                 transform-origin: 0 0;
                 animation: orbitFire1 2s linear infinite;
                 white-space: nowrap;
                 letter-spacing: 20px;
             }
             .fire-circle::after {
                 content: '🌶️ 🎆 💫 🔥 🌟';
                 position: absolute;
                 font-size: 1.3rem;
                 left: 50%;
                 top: 50%;
                 transform-origin: 0 0;
                 animation: orbitFire2 2s linear infinite reverse;
                 white-space: nowrap;
                 letter-spacing: 16px;
             }
             @keyframes orbitFire1 {
                 0% { transform: translate(-50%, -50%) rotate(0deg) translateX(95px) rotate(0deg) scale(1); opacity: 1; }
                 25% { scale: 1.2; opacity: 0.8; }
                 50% { transform: translate(-50%, -50%) rotate(180deg) translateX(95px) rotate(-180deg) scale(0.9); opacity: 1; }
                 75% { scale: 1.1; opacity: 0.9; }
                 100% { transform: translate(-50%, -50%) rotate(360deg) translateX(95px) rotate(-360deg) scale(1); opacity: 1; }
             }
             @keyframes orbitFire2 {
                 0% { transform: translate(-50%, -50%) rotate(0deg) translateX(75px) rotate(0deg) scale(0.8); opacity: 0.7; }
                 50% { transform: translate(-50%, -50%) rotate(180deg) translateX(75px) rotate(-180deg) scale(1.1); opacity: 1; }
                 100% { transform: translate(-50%, -50%) rotate(360deg) translateX(75px) rotate(-360deg) scale(0.8); opacity: 0.7; }
             }
             @keyframes fireCircle {
                 0%, 100% { filter: hue-rotate(0deg) saturate(1) brightness(1); }
                 25% { filter: hue-rotate(15deg) saturate(1.3) brightness(1.3); }
                 50% { filter: hue-rotate(30deg) saturate(1.5) brightness(1.5); }
                 75% { filter: hue-rotate(45deg) saturate(1.2) brightness(1.2); }
             }

             /* Text Bend */
             .text-bend {
                 animation: textBend 4s ease-in-out infinite;
                 transform-origin: center bottom;
                 text-shadow: 0 0 15px #795548;
             }

                 0%, 100% {
                     transform: perspective(800px) rotateX(0deg) rotateY(0deg) skewX(0deg);
                     filter: blur(0px);
                 }
                 25% {
                     transform: perspective(800px) rotateX(20deg) rotateY(15deg) skewX(10deg);
                     filter: blur(1px);
                 }
                 50% {
                     transform: perspective(800px) rotateX(0deg) rotateY(30deg) skewX(-15deg);
                     filter: blur(0px);
                 }
                 75% {
                     transform: perspective(800px) rotateX(-20deg) rotateY(15deg) skewX(5deg);
                     filter: blur(1px);
                 }
             }

             /* Bouncing Words */
             .bouncing-words {
                 animation: bouncingWords 2s ease-in-out infinite;
                 text-shadow: 0 0 20px #ff9800, 0 0 30px #ffb74d, 0 0 40px #ffcc02;
                 letter-spacing: 0.2em;
                 position: relative;
             }
             .bouncing-words::before {
                 content: '🏀 ⚽ 🎾 🏐 🏈';
                 position: absolute;
                 font-size: 1.4rem;
                 left: 50%;
                 top: 50%;
                 transform-origin: 0 0;
                 animation: bounceParticles 2s ease-in-out infinite;
                 white-space: nowrap;
                 letter-spacing: 20px;
                 opacity: 0.7;
             }
             @keyframes bounceParticles {
                 0%, 100% { transform: translate(-50%, -60px) rotate(0deg) scale(0.8); opacity: 0.5; }
                 10% { transform: translate(-50%, -80px) rotate(36deg) scale(1.2); opacity: 0.8; }
                 20% { transform: translate(-50%, -50px) rotate(72deg) scale(0.9); opacity: 0.6; }
                 30% { transform: translate(-50%, -70px) rotate(108deg) scale(1.1); opacity: 0.9; }
                 40% { transform: translate(-50%, -45px) rotate(144deg) scale(0.8); opacity: 0.5; }
                 50% { transform: translate(-50%, -85px) rotate(180deg) scale(1.3); opacity: 1; }
                 60% { transform: translate(-50%, -40px) rotate(216deg) scale(0.7); opacity: 0.4; }
             }
             @keyframes bouncingWords {
                 0%, 100% {
                     transform: translateY(0px) scale(1) rotate(0deg);
                     letter-spacing: 0.2em;
                     filter: hue-rotate(0deg) saturate(1);
                 }
                 10% {
                     transform: translateY(-20px) scale(1.1) rotate(2deg);
                     letter-spacing: 0.3em;
                     filter: hue-rotate(30deg) saturate(1.2);
                 }
                 20% {
                     transform: translateY(0px) scale(1) rotate(0deg);
                     letter-spacing: 0.2em;
                     filter: hue-rotate(60deg) saturate(1);
                 }
                 30% {
                     transform: translateY(-15px) scale(1.05) rotate(-1deg);
                     letter-spacing: 0.25em;
                     filter: hue-rotate(90deg) saturate(1.1);
                 }
                 40% {
                     transform: translateY(0px) scale(1) rotate(0deg);
                     letter-spacing: 0.2em;
                     filter: hue-rotate(120deg) saturate(1);
                 }
                 50% {
                     transform: translateY(-25px) scale(1.15) rotate(3deg);
                     letter-spacing: 0.35em;
                     filter: hue-rotate(150deg) saturate(1.3);
                 }
                 60% {
                     transform: translateY(0px) scale(1) rotate(0deg);
                     letter-spacing: 0.2em;
                     filter: hue-rotate(180deg) saturate(1);
                 }
             }

             /* Figure Eight */
             .figure-eight {
                 animation: figureEight 6s ease-in-out infinite;
                 text-shadow: 0 0 20px #3f51b5;
                 transform-origin: center center;
             }

                 25% {
                     transform: translate(0px, -40px) rotate(90deg) scale(1.2);

                     transform: translate(-30px, -20px) rotate(135deg) scale(1.1);
                 }
                 50% {
                     transform: translate(0px, 0px) rotate(180deg) scale(1);

                 62.5% {
                     transform: translate(30px, 20px) rotate(225deg) scale(1.1);

                 75% {
                     transform: translate(0px, 40px) rotate(270deg) scale(1.2);
                 }
                 87.5% {
                     transform: translate(-30px, 20px) rotate(315deg) scale(1.1);
                 }
                 100% {
                     transform: translate(0px, 0px) rotate(360deg) scale(1);
                 }
             }

             /* PAGE LOADING ANIMATIONS */
             
             .page-load-animation {
                 animation: pageEnter 0.4s ease-out;
             }
             
             .title-load-animation {
                 animation: titleSlideIn 0.5s ease-out 0.1s both;
             }
             
             .subtitle-load-animation {
                 animation: subtitleFadeIn 0.4s ease-out 0.2s both;
             }
             
             .animation-card {
                 animation: cardSlideUp 0.4s ease-out both;
             }
             
             .animation-card:nth-child(1) { animation-delay: 0.3s; }
             .animation-card:nth-child(2) { animation-delay: 0.4s; }
             .animation-card:nth-child(3) { animation-delay: 0.5s; }
             .animation-card:nth-child(4) { animation-delay: 0.6s; }
             .animation-card:nth-child(5) { animation-delay: 0.7s; }
             .animation-card:nth-child(6) { animation-delay: 0.8s; }
             
             @keyframes pageEnter {
                 0% {
                     opacity: 0;
                     transform: scale(0.95);
                 }
                 100% {
                     opacity: 1;
                     transform: scale(1);
                 }
             }
             
             @keyframes titleSlideIn {
                 0% {
                     opacity: 0;
                     transform: translateY(-50px) rotateX(90deg);
                     filter: blur(10px);
                 }
                 100% {
                     opacity: 1;
                     transform: translateY(0) rotateX(0deg);
                     filter: blur(0px);
                 }
             }
             
             @keyframes subtitleFadeIn {
                 0% {
                     opacity: 0;
                     transform: translateY(30px) scale(0.8);
                     filter: blur(5px);
                 }
                 100% {
                     opacity: 1;
                     transform: translateY(0) scale(1);
                     filter: blur(0px);
                 }
             }
             
             @keyframes cardSlideUp {
                 0% {
                     opacity: 0;
                     transform: translateY(60px) rotateY(15deg) scale(0.9);
                     filter: blur(8px);
                 }
                 100% {
                     opacity: 1;
                     transform: translateY(0) rotateY(0deg) scale(1);
                     filter: blur(0px);
                 }
             }
             
             /* ENHANCED LOADING EFFECTS */
             
             .control-btn.initial-load {
                 animation: buttonPop 0.3s ease-out both;
             }
             
             .control-btn.initial-load:nth-child(1) { animation-delay: 0.8s; }
             .control-btn.initial-load:nth-child(2) { animation-delay: 0.9s; }

                 60% {
                     transform: scale(1.1) rotate(2deg);
                 }

                     transform: scale(1) rotate(0deg);
                     filter: blur(0px);
                 }
             }
             
             /* STAGGERED ANIMATIONS FOR ELEMENTS */

                 }

                     opacity: 1;
                     transform: translateY(0) rotateX(0deg) scale(1);
                     filter: blur(0px) brightness(1);
                 }

               mounted: function() {
                   // Disable initial load animations after they complete
                   setTimeout(() => {
                       this.isInitialLoad = false;
                   }, 1500); // After all initial animations complete
               },
               methods: {
                    startRandomShow: function(){
                        this.isInitialLoad = false; // Disable initial load animations
                        this.randomEffectActive = true;
                        this.selectMode = false;
                        this.selectedAnimation = '';
                        
                        // Ensure we start with a clean state
                        this.currentRandomEffect = {};
                        
                        // Small delay to ensure DOM is ready, then generate first effect
                        this.$nextTick(() => {
                            setTimeout(() => {
                                this.generateRandomEffect();
                                this.startAutoRefresh();
                            }, 50);
                        });
                    },
                    showDropdown: function(){
                        this.isInitialLoad = false; // Disable initial load animations
                        this.selectMode = true;
                        this.randomEffectActive = false;
                        this.selectedAnimation = '';
                        this.currentRandomEffect = {};
                        this.stopAutoRefresh();
                        this.stopCountdown();
                    },
                    playSelectedAnimation: function(){
                        if (this.selectedAnimation) {
                            const effect = this.randomEffects.find(e => e.name === this.selectedAnimation);
                            if (effect) {
                                this.currentRandomEffect = { ...effect };
                                this.processSpecialEffect();
                                // Start continuous animation loop for selected animations
                                this.startSelectedAnimationLoop();
                            }
                        }
                    },
                    startSelectedAnimationLoop: function(){
                        // Clear any existing timers
                        this.stopAutoRefresh();
                        
                        // Set up continuous animation refresh for selected mode
                        if (this.selectMode && this.currentRandomEffect.name) {
                            this.selectedAnimationTimer = setInterval(() => {
                                if (this.selectMode && this.currentRandomEffect.name) {
                                    this.processSpecialEffect();
                                }
                            }, 5000); // Refresh every 5 seconds to keep animation alive
                        }
                    },
                    resetToInitial: function(){
                        this.randomEffectActive = false;
                        this.selectMode = false;
                        this.selectedAnimation = '';
                        this.currentRandomEffect = {};
                        this.stopAutoRefresh();
                        this.stopCountdown();
                        this.stopSelectedAnimationTimer();
                    },
                    stopSelectedAnimationTimer: function(){
                        if (this.selectedAnimationTimer) {
                            clearInterval(this.selectedAnimationTimer);
                            this.selectedAnimationTimer = null;
                        }
                    },
                    processSpecialEffect: function(){
                        // Temporarily hide current effect for smooth transition (only for random mode)
                        if (this.randomEffectActive && this.$refs.randomEffectContainer) {
                            this.$refs.randomEffectContainer.style.opacity = '0';
                            this.$refs.randomEffectContainer.style.transform = 'scale(0.8)';
                        }
                        
                        const processEffect = () => {
                            this.$nextTick(() => {
                                // Ensure we have an effect to process
                                if (!this.currentRandomEffect || !this.currentRandomEffect.name) {
                                    return;
                                }
                                
                                if (this.currentRandomEffect.name === 'Matrix Rain') {
                                    const originalText = this.currentRandomEffect.originalContent || this.currentRandomEffect.content;
                                    this.currentRandomEffect.content = originalText.split('').map((char, index) => 
                                        `<span class="matrix-char" style="animation-delay: ${index * 0.05}s">${char}</span>`
                                    ).join('');
                                }
                                else if (this.currentRandomEffect.name === 'Wave Effect') {
                                    const originalText = this.currentRandomEffect.originalContent || this.currentRandomEffect.content;
                                    this.currentRandomEffect.content = originalText.split('').map((char, index) => 
                                        `<span class="wave-char" style="animation-delay: ${index * 0.1}s">${char === ' ' ? '&nbsp;' : char}</span>`
                                    ).join('');
                                }
                                else if (this.currentRandomEffect.name === 'Particle Explosion') {
                                    setTimeout(() => this.createRandomExplosion(), 100);
                                }
                                
                                // Restart animations - wait for DOM update
                                this.$nextTick(() => {
                                    setTimeout(() => {
                                        if (this.$refs.randomEffectContainer) {
                                            const element = this.$refs.randomEffectContainer;
                                            const classes = element.className;
                                            element.className = '';
                                            
                                            // Force reflow
                                            element.offsetHeight;
                                            
                                            setTimeout(() => {
                                                element.className = classes;
                                                // Restore visibility for random mode
                                                if (this.randomEffectActive) {
                                                    element.style.opacity = '1';
                                                    element.style.transform = 'scale(1)';
                                                    element.style.transition = 'all 0.3s ease';
                                                }
                                            }, 10);
                                        }
                                    }, 50);
                                });
                            });
                        };
                        
                        // Add delay only for random mode transition
                        if (this.randomEffectActive) {
                            setTimeout(processEffect, 200);
                        } else {
                            processEffect();
                        }
                    },
                    startAutoRefresh: function(){
                        // Clear any existing timer
                        if (this.autoRefreshTimer) {
                            clearInterval(this.autoRefreshTimer);
                        }
                        
                        // Start countdown
                        this.startCountdown();
                        
                        // Start new timer to auto-change effects
                        this.autoRefreshTimer = setInterval(() => {
                            if (this.randomEffectActive) {
                                this.generateRandomEffect();
                                this.startCountdown(); // Restart countdown after each effect change
                            }
                        }, this.autoRefreshInterval);
                    },
                    startCountdown: function(){
                        // Clear existing countdown
                        if (this.countdownTimer) {
                            clearInterval(this.countdownTimer);
                        }
                        
                        // Set initial countdown value
                        this.secondsLeft = Math.floor(this.autoRefreshInterval / 1000);
                        this.progressBarWidth = 100;
                        
                        // Start countdown timer (update every 100ms for smooth progress bar)
                        const totalMs = this.autoRefreshInterval;
                        const intervalMs = 100;
                        let elapsedMs = 0;
                        
                        this.countdownTimer = setInterval(() => {
                            elapsedMs += intervalMs;
                            this.secondsLeft = Math.ceil((totalMs - elapsedMs) / 1000);
                            this.progressBarWidth = Math.max(0, ((totalMs - elapsedMs) / totalMs) * 100);
                            
                            if (elapsedMs >= totalMs) {
                                this.secondsLeft = Math.floor(this.autoRefreshInterval / 1000);
                                this.progressBarWidth = 100;
                                elapsedMs = 0;
                            }
                        }, intervalMs);
                    },
                    stopCountdown: function(){
                        if (this.countdownTimer) {
                            clearInterval(this.countdownTimer);
                            this.countdownTimer = null;
                        }
                        this.secondsLeft = 0;
                    },
                    stopAutoRefresh: function(){
                        if (this.autoRefreshTimer) {
                            clearInterval(this.autoRefreshTimer);
                            this.autoRefreshTimer = null;
                        }
                        this.stopCountdown();
                        this.stopSelectedAnimationTimer();
                    },
                    generateRandomEffect: function(){
                        const randomIndex = Math.floor(Math.random() * this.randomEffects.length);
                        this.currentRandomEffect = { ...this.randomEffects[randomIndex] };
                        
                        // Ensure we process the effect properly
                        this.$nextTick(() => {
                            this.processSpecialEffect();
                        });
                    },
                    createRandomExplosion: function(){
                        if (!this.$refs.randomEffectContainer) return;
                        
                        // Clear existing particles
                        const existingParticles = this.$refs.randomEffectContainer.querySelectorAll('.explosion-particle');
                        existingParticles.forEach(p => p.remove());
                        
                        // Create EXTREME amount of particles (3 waves)
                        const container = this.$refs.randomEffectContainer;
                        const rect = container.getBoundingClientRect();
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        
                        // Wave 1: Large outer explosion
                        for(let i = 0; i < 50; i++){
                            const particle = document.createElement('div');
                            particle.className = 'explosion-particle';
                            
                            const angle = (Math.PI * 2 * i) / 50;
                            const velocity = 100 + Math.random() * 200;
                            const dx = Math.cos(angle) * velocity;
                            const dy = Math.sin(angle) * velocity;
                            
                            particle.style.cssText = `
                                left: ${centerX}px;
                                top: ${centerY}px;
                                --dx: ${dx}px;
                                --dy: ${dy}px;
                                animation: explodeParticle 3s ease-out forwards;
                                animation-delay: ${Math.random() * 0.2}s;
                                background: radial-gradient(circle, #ff6b35 0%, #f093fb 50%, #4facfe 100%);
                                width: ${8 + Math.random() * 8}px;
                                height: ${8 + Math.random() * 8}px;
                            `;
                            
                            container.appendChild(particle);
                            setTimeout(() => { if(particle.parentNode) particle.remove(); }, 3200);
                        }
                        
                        // Wave 2: Medium middle burst
                        setTimeout(() => {
                            for(let i = 0; i < 30; i++){
                                const particle = document.createElement('div');
                                particle.className = 'explosion-particle';
                                
                                const angle = Math.random() * Math.PI * 2;
                                const velocity = 60 + Math.random() * 120;
                                const dx = Math.cos(angle) * velocity;
                                const dy = Math.sin(angle) * velocity;
                                
                                particle.style.cssText = `
                                    left: ${centerX}px;
                                    top: ${centerY}px;
                                    --dx: ${dx}px;
                                    --dy: ${dy}px;
                                    animation: explodeParticle 2.5s ease-out forwards;
                                    background: radial-gradient(circle, #f093fb 0%, #00f2fe 50%, #ff6b35 100%);
                                    width: ${6 + Math.random() * 6}px;
                                    height: ${6 + Math.random() * 6}px;
                                `;
                                
                                container.appendChild(particle);
                                setTimeout(() => { if(particle.parentNode) particle.remove(); }, 2700);
                            }
                        }, 300);
                        
                        // Wave 3: Fast inner sparkles
                        setTimeout(() => {
                            for(let i = 0; i < 40; i++){
                                const particle = document.createElement('div');
                                particle.className = 'explosion-particle';
                                
                                const angle = Math.random() * Math.PI * 2;
                                const velocity = 30 + Math.random() * 80;
                                const dx = Math.cos(angle) * velocity;
                                const dy = Math.sin(angle) * velocity;
                                
                                particle.style.cssText = `
                                    left: ${centerX}px;
                                    top: ${centerY}px;
                                    --dx: ${dx}px;
                                    --dy: ${dy}px;
                                    animation: explodeParticle 2s ease-out forwards;
                                    background: radial-gradient(circle, #ffffff 0%, #4facfe 50%, #f093fb 100%);
                                    width: ${4 + Math.random() * 4}px;
                                    height: ${4 + Math.random() * 4}px;
                                    box-shadow: 0 0 20px #ffffff, 0 0 40px currentColor;
                                `;
                                
                                container.appendChild(particle);
                                setTimeout(() => { if(particle.parentNode) particle.remove(); }, 2200);
                            }
                        }, 600);
                    }
               },
               watch: {
                   randomEffectActive: function(newVal) {
                       if(newVal) {
                           // Generate a new random effect every time it's toggled on
                           this.generateRandomEffect();
                           this.startAutoRefresh();
                       } else {
                           // Stop auto refresh when turned off
                           this.stopAutoRefresh();
                       }
                   }
               },
               beforeUnmount() {
                   // Clean up timers when the app is torn down
                   this.stopAutoRefresh();
                   this.stopCountdown();
                   this.stopSelectedAnimationTimer();
               }
           }).mount('#app')
        </script>
