<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Support - Rexyrex</title>
        <link rel="icon" href="/favicon.ico">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/navbar.css">
        <style>
            :root {
                --bg-primary: #0a0a0f;
                --bg-secondary: #12121a;
                --bg-card: rgba(255, 255, 255, 0.03);
                --text-primary: #ffffff;
                --text-secondary: rgba(255, 255, 255, 0.7);
                --text-muted: rgba(255, 255, 255, 0.5);
                --accent-primary: #6366f1;
                --accent-secondary: #8b5cf6;
                --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
                --border-color: rgba(255, 255, 255, 0.08);
                --glow-color: rgba(99, 102, 241, 0.3);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                background: var(--bg-primary);
                color: var(--text-primary);
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* Animated Background */
            .animated-bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                overflow: hidden;
            }

            .animated-bg::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                            radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
                animation: bgFloat 20s ease-in-out infinite;
            }

            @keyframes bgFloat {
                0%, 100% { transform: translate(0, 0) rotate(0deg); }
                33% { transform: translate(2%, 2%) rotate(1deg); }
                66% { transform: translate(-1%, 1%) rotate(-1deg); }
            }

            .floating-shapes {
                position: absolute;
                width: 100%;
                height: 100%;
            }

            .shape {
                position: absolute;
                border-radius: 50%;
                opacity: 0.5;
                filter: blur(60px);
            }

            .shape-1 {
                width: 400px;
                height: 400px;
                background: var(--accent-primary);
                top: 10%;
                right: 10%;
                animation: float1 15s ease-in-out infinite;
            }

            .shape-2 {
                width: 300px;
                height: 300px;
                background: var(--accent-secondary);
                bottom: 20%;
                left: 5%;
                animation: float2 18s ease-in-out infinite;
            }

            @keyframes float1 {
                0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
                50% { transform: translate(-30px, 30px) scale(1.1); opacity: 0.5; }
            }

            @keyframes float2 {
                0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
                50% { transform: translate(20px, -20px) scale(1.05); opacity: 0.4; }
            }

            /* Support Section */
            .support-section {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 7rem 2rem 2rem; /* top clears the fixed navbar */
            }

            .support-card {
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: 24px;
                padding: 3rem;
                max-width: 600px;
                width: 100%;
                text-align: center;
                backdrop-filter: blur(20px);
                box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4),
                            0 0 100px var(--glow-color);
                animation: cardAppear 0.8s ease-out;
            }

            @keyframes cardAppear {
                from {
                    opacity: 0;
                    transform: translateY(30px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .support-icon {
                width: 100px;
                height: 100px;
                margin: 0 auto 2rem;
                background: var(--accent-gradient);
                border-radius: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2.5rem;
                color: white;
                box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
                animation: iconPulse 3s ease-in-out infinite;
            }

            @keyframes iconPulse {
                0%, 100% { transform: scale(1); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4); }
                50% { transform: scale(1.05); box-shadow: 0 20px 50px rgba(99, 102, 241, 0.5); }
            }

            .support-title {
                font-size: 2.5rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
                background: var(--accent-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .support-subtitle {
                color: var(--text-secondary);
                font-size: 1.1rem;
                margin-bottom: 2.5rem;
                line-height: 1.6;
            }

            .contact-section {
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 2rem;
                margin-bottom: 2rem;
            }

            .contact-label {
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: var(--text-muted);
                margin-bottom: 0.75rem;
            }

            .contact-email {
                font-family: 'JetBrains Mono', monospace;
                font-size: 1.25rem;
                color: var(--text-primary);
                word-break: break-all;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.75rem;
            }

            .contact-email i {
                color: var(--accent-primary);
                font-size: 1.1rem;
            }

            .email-link {
                color: var(--text-primary);
                text-decoration: none;
                transition: color 0.3s ease;
            }

            .email-link:hover {
                color: var(--accent-primary);
                text-decoration: none;
            }

            .support-btn {
                display: inline-flex;
                align-items: center;
                gap: 0.75rem;
                padding: 1rem 2rem;
                background: var(--accent-gradient);
                color: white;
                border: none;
                border-radius: 14px;
                font-size: 1rem;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
            }

            .support-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
                color: white;
                text-decoration: none;
            }

            .support-info {
                margin-top: 2rem;
                padding-top: 2rem;
                border-top: 1px solid var(--border-color);
            }

            .support-info p {
                color: var(--text-muted);
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
            }

            .back-link {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                color: var(--text-secondary);
                text-decoration: none;
                font-size: 0.9rem;
                margin-top: 2rem;
                transition: color 0.3s ease;
            }

            .back-link:hover {
                color: var(--accent-primary);
                text-decoration: none;
            }

            /* Responsive */
            @media (max-width: 576px) {
                .support-card {
                    padding: 2rem 1.5rem;
                    margin: 1rem;
                }

                .support-title {
                    font-size: 2rem;
                }

                .support-icon {
                    width: 80px;
                    height: 80px;
                    font-size: 2rem;
                }

                .contact-email {
                    font-size: 1rem;
                    flex-direction: column;
                    gap: 0.5rem;
                }
            }
        </style>
    </head>

    <body>
        <div id="nav-placeholder"></div>

        <!-- Animated Background -->
        <div class="animated-bg">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
            </div>
        </div>

        <!-- Support Section -->
        <div class="support-section">
            <div class="support-card">
                <div class="support-icon">
                    <i class="fas fa-headset"></i>
                </div>
                
                <h1 class="support-title">Support</h1>
                <p class="support-subtitle">
                    Need help with one of my apps? I'm here to assist you. 
                    Feel free to reach out with any questions or feedback.
                </p>

                <div class="contact-section">
                    <div class="contact-label">Contact Email</div>
                    <div class="contact-email">
                        <i class="fas fa-envelope"></i>
                        <a href="mailto:rexyrex.dev@gmail.com" class="email-link">rexyrex.dev@gmail.com</a>
                    </div>
                </div>

                <a href="mailto:rexyrex.dev@gmail.com" class="support-btn">
                    <i class="fas fa-paper-plane"></i>
                    Send Email
                </a>

                <div class="support-info">
                    <p>We typically respond within 24-48 hours.</p>
                    <p>Please include your device model and app version when reporting issues.</p>
                </div>

                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>

        <script src="/js/common.js"></script>
    </body>
</html>
